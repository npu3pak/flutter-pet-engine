name: example
description: "example: приложение-пример pet_engine — каталог фич, визуальная проверка, документация кодом."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.0-275.0.dev

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  hooks: ^2.0.0
  path: ^1.9.1
  pet_engine:
    path: ../
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Исходники проектов лежат в example/assets рядом и объявляются по
    # подкаталогам: Flutter не включает вложенные каталоги рекурсивно.
    - assets/Pet/project.json
    - assets/Pet/models/
    - assets/Pet/textures/
    - assets/Pet/sprites/
    - assets/Pet/3d_models/cat/
    - assets/Pet/3d_models/cat/textures/
    - assets/Pet/3d_models/puppy/
    - assets/Pet/3d_models/puppy/textures/
    - assets/House/project.json
    - assets/House/models/
    - assets/House/textures/
    - assets/House/sprites/
    - assets/shaders/
