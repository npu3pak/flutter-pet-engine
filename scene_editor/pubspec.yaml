name: scene_editor
description: "scene_editor: редактор сцен pet_engine_v2 — документ, ресурсы, разметка (macOS + iPadOS)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0-275.0.dev

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  file_picker: ^11.0.2
  hooks: ^2.0.0
  image: ^4.9.1
  image_picker: ^1.1.2
  path: ^1.9.1
  path_provider: ^2.1.5
  pet_engine_v2:
    path: ../engine
  shared_preferences: ^2.3.4
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/pet_project/
